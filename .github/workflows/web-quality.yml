name: Web Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Lint, type-check, and test
        run: npm run check

      - name: Firestore security rules and account-deletion emulator tests
        run: npm run test:firestore-rules

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Web E2E
        run: npx playwright test

      - name: Browser compatibility matrix
        run: npx playwright test --config=playwright.compat.config.ts

      - name: Responsive landscape, tablet, and foldable-like matrix
        run: npx playwright test --config=playwright.responsive.config.ts

      - name: PWA visual states
        run: npx playwright test --config=playwright.visual.config.ts

      - name: Web accessibility matrix
        run: npx playwright test --config=playwright.a11y.config.ts

      - name: Web performance smoke benchmark
        run: npm run benchmark:web

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload PWA visual references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-visual-references
          path: test-results/visual
          if-no-files-found: ignore

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-results
          if-no-files-found: ignore
